
ekf_filter_node:
  ros__parameters:
    frequency: 30.0       
    two_d_mode: true      # 2D模式：忽略Z轴高度变化
    publish_tf: true      # 让EKF发布坐标变换！，告诉系统车在哪

   
    map_frame: map              
    odom_frame: odom            
    base_link_frame: base_footprint  
    world_frame: odom           

    #轮子里程计 (Odom)
    odom0: /mbot_base_controller/odometry
    
    # 矩阵配置：[x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,   # 麦克纳姆轮：相信它的 X速度 和 Y速度
                   false, false, true,    # 相信它的 旋转速度
                   false, false, false]
    odom0_differential: false # 是否使用差分模式（一般设 false）

    # IMU (惯性传感器)
    imu0: /imu/data
    
    # 矩阵配置
    imu0_config: [false, false, false,
                  false, false, true,     
                  false, false, true,    
                  false, false, false]    #
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true # 自动去掉重力加速度的影响